<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Anti-cache rigoroso para o arquivo HTML principal -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Proteção básica contra falhas catastróficas de carregamento (Tela Azul) -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Failed to fetch') || e.message.includes('ChunkLoadError'))) {
          console.warn('Erro de chunk detectado no index.html. Forçando recarregamento...');
          window.location.reload();
        }
      });

      // Fallback: Se o root estiver vazio após 8 segundos, tenta uma limpeza de emergência
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          var loader = document.querySelector('.initial-loader');
          if (loader && root && root.contains(loader)) {
            console.error('Falha crítica de inicialização. Executando limpeza de emergência...');
            if (!sessionStorage.getItem('emergency_reload')) {
              sessionStorage.setItem('emergency_reload', 'true');
              localStorage.clear();
              window.location.reload();
            }
          }
        }, 8000);
      });
    </script>
    <title>P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças</title>
    <meta name="description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">
    <meta name="author" content="P-CON Construct" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="P-CON" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png">

    <!-- Dinamic PWA Manifest -->
    <script>
      (function() {
        var isClient = ["/cliente", "/area-cliente", "/checkout"].some(function(route) {
          return window.location.pathname.startsWith(route);
        });
        var manifestUrl = isClient ? '/client-manifest.webmanifest?v=' + Date.now() : '/manifest.webmanifest?v=' + Date.now();
        document.write('<link rel="manifest" href="' + manifestUrl + '">');
        
        if (isClient) {
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.content = "Cliente P-CON";
        }
      })();
    </script>
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pcon" />
    <meta name="twitter:image" content="/pwa-512x512.png">
    
    
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/pwa-192x192.png">
    
  
  
  
  <meta property="og:title" content="P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças">
  <meta name="twitter:title" content="P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças">
  <meta property="og:description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">
  <meta name="twitter:description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">
</head>

  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0a1628; color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
        <style>
          @keyframes spin-loader {
            to { transform: rotate(360deg); }
          }
          .initial-loader {
            width: 40px; height: 40px; 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top-color: #3b82f6; 
            border-radius: 50%; 
            animation: spin-loader 0.8s linear infinite; 
            margin-bottom: 20px;
          }
        </style>
        <div class="initial-loader"></div>
        <h2 style="font-size: 1.2rem; font-weight: 600; margin: 0 0 8px;">P-CON Plataforma</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin: 0; text-align: center; max-width: 80%;">Carregando sistema com segurança...<br>Isso pode levar alguns segundos na primeira vez.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
