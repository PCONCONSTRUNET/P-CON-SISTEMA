<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Anti-cache rigoroso para o arquivo HTML principal -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Script de proteção contra Tela Azul (Erro de carregamento de chunk do Vite) -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'))) {
          console.warn('Detectado erro de cache do Vite. Forçando recarregamento ignorando cache...');
          window.location.href = window.location.pathname + '?v=' + new Date().getTime() + window.location.hash;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && (e.reason.message.includes('Failed to fetch dynamically imported module') || e.reason.message.includes('Importing a module script failed'))) {
          console.warn('Detectado erro de cache do Vite em promise. Forçando recarregamento ignorando cache...');
          window.location.href = window.location.pathname + '?v=' + new Date().getTime() + window.location.hash;
        }
      });

      // Fallback definitivo para tela azul/branca: Se o React não montar em 5 segundos, forçar reload burlando o cache
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.querySelector('.initial-loader');
          // Se o loader ainda estiver presente após 5 segundos, significa que o React (main.tsx) falhou em iniciar
          if (loader) {
            if (!sessionStorage.getItem('reloaded-fallback') || sessionStorage.getItem('reloaded-fallback') === '1') {
              var attempts = parseInt(sessionStorage.getItem('reloaded-fallback') || '0');
              sessionStorage.setItem('reloaded-fallback', (attempts + 1).toString());
              
              console.warn('React não iniciou (Loader não foi substituído). Provável problema de cache severo. Forçando limpeza e recarregamento...');
              
              // Tenta forçar limpeza total via Service Worker
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(reg) { reg.unregister(); });
                });
              }
              
              window.location.href = window.location.pathname + '?clear_cache_hard=' + new Date().getTime() + window.location.hash;
            } else {
               // Falhou duplamente. Mostrar botão manual.
               var root = document.getElementById('root');
               if(root) {
                 root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a1628;color:white;font-family:sans-serif;padding:20px;text-align:center;"><h2>Falha Crítica de Carregamento</h2><p>O sistema não conseguiu carregar a nova versão.</p><button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href=\'/\';" style="padding:10px 20px; background:#3b82f6; border:none; border-radius:6px; color:white; cursor:pointer; margin-top:20px;">Forçar Limpeza e Restaurar</button></div>';
               }
            }
          } else {
            sessionStorage.removeItem('reloaded-fallback'); // Sucesso
          }
        }, 5000);
      });
    </script>

    <!-- Script automático definitivo para aniquilar Service Workers antigos -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            if (regs.length > 0) {
              console.log('Unregistering stuck Service Workers...', regs);
              var unregPromises = regs.map(function(reg) { return reg.unregister(); });
              Promise.all(unregPromises)
                .then(function() { return caches.keys(); })
                .then(function(keys) { return Promise.all(keys.map(function(k) { return caches.delete(k); })); })
                .then(function() { 
                  console.log('Caches cleared. Reloading...');
                  window.location.reload(true); 
                });
            }
          });
        }
      })();
    </script>
    <title>P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças</title>
    <meta name="description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">
    <meta name="author" content="P-CON Construct" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="P-CON" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png">

    <!-- Dinamic PWA Manifest -->
    <script>
      (function() {
        var isClient = ["/cliente", "/area-cliente", "/checkout"].some(function(route) {
          return window.location.pathname.startsWith(route);
        });
        var manifestUrl = isClient ? '/client-manifest.webmanifest?v=' + Date.now() : '/manifest.webmanifest?v=' + Date.now();
        document.write('<link rel="manifest" href="' + manifestUrl + '">');
        
        if (isClient) {
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.content = "Cliente P-CON";
        }
      })();
    </script>
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pcon" />
    <meta name="twitter:image" content="/pwa-512x512.png">
    
    
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/pwa-192x192.png">
    
  
  
  
  <meta property="og:title" content="P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças">
  <meta name="twitter:title" content="P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças">
  <meta property="og:description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">
  <meta name="twitter:description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">
</head>

  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0a1628; color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
        <style>
          @keyframes spin-loader {
            to { transform: rotate(360deg); }
          }
          .initial-loader {
            width: 40px; height: 40px; 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top-color: #3b82f6; 
            border-radius: 50%; 
            animation: spin-loader 0.8s linear infinite; 
            margin-bottom: 20px;
          }
        </style>
        <div class="initial-loader"></div>
        <h2 style="font-size: 1.2rem; font-weight: 600; margin: 0 0 8px;">P-CON Plataforma</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin: 0; text-align: center; max-width: 80%;">Carregando sistema com segurança...<br>Isso pode levar alguns segundos na primeira vez.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
