<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Anti-cache rigoroso para o arquivo HTML principal -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Script de proteção contra Tela Azul (Erro de carregamento de chunk do Vite) -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'))) {
          console.warn('Detectado erro de cache do Vite. Forçando recarregamento ignorando cache...');
          window.location.href = window.location.pathname + '?v=' + new Date().getTime() + window.location.hash;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && (e.reason.message.includes('Failed to fetch dynamically imported module') || e.reason.message.includes('Importing a module script failed'))) {
          console.warn('Detectado erro de cache do Vite em promise. Forçando recarregamento ignorando cache...');
          window.location.href = window.location.pathname + '?v=' + new Date().getTime() + window.location.hash;
        }
      });

      // Fallback definitivo para tela vazia: Se o React não montar em 4 segundos, forçar reload burlando o cache do celular
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.innerHTML.trim() === '') {
            if (!sessionStorage.getItem('reloaded-fallback') || sessionStorage.getItem('reloaded-fallback') === '1') {
              // Marca que já tentou 2 vezes para não ficar em loop infinito se o servidor estiver realmente fora do ar
              var attempts = parseInt(sessionStorage.getItem('reloaded-fallback') || '0');
              sessionStorage.setItem('reloaded-fallback', (attempts + 1).toString());
              
              console.warn('React não iniciou. Provável tela azul de cache. Forçando nova versão do servidor...');
              // Burla o cache agressivo do navegador de forma infalível
              window.location.href = window.location.pathname + '?clear_cache=' + new Date().getTime() + window.location.hash;
            }
          } else {
            sessionStorage.removeItem('reloaded-fallback'); // Sucesso, limpar trava
          }
        }, 4000);
      });
    </script>

    <!-- Script automático definitivo para aniquilar Service Workers antigos -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            if (regs.length > 0) {
              console.log('Unregistering stuck Service Workers...', regs);
              var unregPromises = regs.map(function(reg) { return reg.unregister(); });
              Promise.all(unregPromises)
                .then(function() { return caches.keys(); })
                .then(function(keys) { return Promise.all(keys.map(function(k) { return caches.delete(k); })); })
                .then(function() { 
                  console.log('Caches cleared. Reloading...');
                  window.location.reload(true); 
                });
            }
          });
        }
      })();
    </script>
    <title>P-CON Assinaturas | Sistema de Gestão de Clientes e Cobranças</title>
    <meta name="description" content="Sistema interno de gestão de clientes, assinaturas e cobranças da P-CON CONSTRUNET">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="P-CON" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png">

    <!-- Dinamic PWA Manifest -->
    <script>
      (function() {
        var isClient = ["/cliente", "/area-cliente", "/checkout"].some(function(route) {
          return window.location.pathname.startsWith(route);
        });
        var manifestUrl = isClient ? '/client-manifest.webmanifest?v=' + Date.now() : '/manifest.webmanifest?v=' + Date.now();
        document.write('<link rel="manifest" href="' + manifestUrl + '">');
        
        if (isClient) {
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.content = "Cliente P-CON";
        }
      })();
    </script>
